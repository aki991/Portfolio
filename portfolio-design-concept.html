<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Design Concept — Dark Teal / Cyan / Amber</title>
<style>
:root{
  --bg-outer:#040908;
  --canvas:#0C1A18;
  --canvas-deep:#081211;
  --glass:rgba(18,42,40,.55);
  --glass-brt:rgba(24,56,53,.65);
  --line:rgba(92,224,245,.16);
  --line-strong:rgba(92,224,245,.35);
  --cyan:#4FE0F5;
  --cyan-dim:#2AA8C4;
  --blue:#2E8FD8;
  --amber:#F2B23C;
  --amber-deep:#D98E1F;
  --ink-hi:#DDE9E7;
  --ink-mid:#9FB4B1;
  --ink-low:#5E7370;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg-outer);
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  padding:48px 20px;
  display:flex;justify-content:center;
}
/* ============ the mockup canvas ============ */
.canvas{
  width:100%;max-width:1240px;
  background:
    radial-gradient(1100px 500px at 78% 0%, rgba(46,143,216,.10), transparent 60%),
    radial-gradient(900px 600px at 8% 30%, rgba(79,224,245,.05), transparent 60%),
    var(--canvas);
  border:1px solid rgba(92,224,245,.10);
  border-radius:28px;
  overflow:hidden;
  position:relative;
  box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 40px 120px rgba(0,0,0,.6), 0 0 90px rgba(79,224,245,.05);
}
/* faint circuit texture over whole canvas */
.canvas::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(79,224,245,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,224,245,.03) 1px, transparent 1px);
  background-size:72px 72px;
  mask-image:linear-gradient(#000, transparent 18%, transparent 82%, #000);
}
section{position:relative;padding:88px 72px}
/* ============ greeked text bars ============ */
.bar{border-radius:99px;background:var(--ink-mid);opacity:.45}
.bar.hi{background:var(--ink-hi);opacity:.92}
.bar.low{opacity:.28}
.bar.cyan{background:var(--cyan);opacity:.9}
.bar.amber{background:var(--amber);opacity:.95}
.h-xl{height:34px}.h-lg{height:26px}.h-md{height:14px}.h-sm{height:10px}.h-xs{height:8px}
.stack{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g18{gap:18px}
/* eyebrow tag */
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;
  border:1px solid var(--line-strong);background:rgba(79,224,245,.06);width:max-content}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.eyebrow .bar{height:8px}
/* buttons */
.btn{height:46px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 26px}
.btn .bar{height:9px;opacity:1}
.btn-amber{background:linear-gradient(180deg,#FFC85E,var(--amber) 45%,var(--amber-deep));
  box-shadow:0 6px 24px rgba(242,178,60,.35), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-amber .bar{background:#3A2604}
.btn-ghost{border:1px solid var(--line-strong);background:rgba(79,224,245,.05);
  box-shadow:inset 0 0 18px rgba(79,224,245,.05)}
.btn-ghost .bar{background:var(--cyan)}
/* glass card */
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 18px 50px rgba(0,0,0,.35);
  position:relative;
}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 40px rgba(79,224,245,.06) inset}
/* icon tile */
.icon-tile{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-strong);background:rgba(79,224,245,.07);
  box-shadow:0 0 22px rgba(79,224,245,.18), inset 0 0 14px rgba(79,224,245,.08)}
.icon-tile svg{stroke:var(--cyan);filter:drop-shadow(0 0 6px rgba(79,224,245,.7))}
.icon-tile.amber{border-color:rgba(242,178,60,.4);background:rgba(242,178,60,.07);
  box-shadow:0 0 22px rgba(242,178,60,.18), inset 0 0 14px rgba(242,178,60,.08)}
.icon-tile.amber svg{stroke:var(--amber);filter:drop-shadow(0 0 6px rgba(242,178,60,.7))}
/* ============ connector spine between sections ============ */
.connector{display:flex;flex-direction:column;align-items:center;height:64px;position:relative;z-index:2}
.connector .wire{width:2px;flex:1;background:linear-gradient(180deg,transparent,var(--cyan-dim),transparent);opacity:.7}
.connector .node{width:10px;height:10px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 12px var(--amber),0 0 26px rgba(242,178,60,.5);margin:3px 0}
.connector.cy .node{background:var(--cyan);box-shadow:0 0 12px var(--cyan),0 0 26px rgba(79,224,245,.5)}
@media (prefers-reduced-motion:no-preference){
  .connector .node{animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
}
/* ============ 1 · NAV ============ */
.nav{display:flex;align-items:center;justify-content:space-between;padding:26px 72px;
  border-bottom:1px solid rgba(92,224,245,.08);position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:34px;height:34px;border-radius:11px;border:1px solid var(--line-strong);
  background:linear-gradient(140deg,rgba(79,224,245,.14),rgba(46,143,216,.06));position:relative;
  box-shadow:0 0 18px rgba(79,224,245,.2)}
.logo-mark::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 10px var(--amber)}
.menu{display:flex;align-items:center;gap:30px}
.menu .bar{height:8px}
.menu .btn{height:38px;padding:0 20px;border-radius:11px}
/* ============ 2 · HERO ============ */

.hero-img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg, rgba(12,26,24,.97) 0%, rgba(12,26,24,.86) 26%, rgba(12,26,24,.35) 55%, rgba(12,26,24,.05) 78%),
             linear-gradient(0deg, rgba(12,26,24,.9), transparent 30%)}
.hero-copy{position:relative;z-index:2;align-self:center;padding:96px 72px;max-width:560px}
.hero-headline{margin:26px 0 22px}
.hero-cta{display:flex;gap:16px;margin-top:34px}
/* ============ 3 · SERVICES ============ */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px}
.svc{padding:32px 28px}
.svc .icon-tile{margin-bottom:22px}
.sec-head{display:flex;flex-direction:column;align-items:center;gap:16px}
/* ============ 4 · CASE STUDY ============ */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;margin-top:44px;align-items:stretch}
.case-left{padding:38px 36px}
.case-row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(92,224,245,.08)}
.case-row:last-of-type{border-bottom:0}
.case-dot{width:12px;height:12px;border-radius:50%;margin-top:2px;flex:none;
  background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.case-dot.amber{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.quote{margin-top:22px;padding:20px 22px;border-left:3px solid var(--amber);
  background:rgba(242,178,60,.05);border-radius:0 var(--r-md) var(--r-md) 0}
.quote-mark{color:var(--amber);font-size:34px;line-height:.6;font-family:Georgia,serif;
  text-shadow:0 0 14px rgba(242,178,60,.6);display:block;margin-bottom:12px}
.case-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:44px 32px;text-align:center}
.stat-num{font-size:84px;font-weight:800;letter-spacing:-2px;color:var(--amber);
  text-shadow:0 0 30px rgba(242,178,60,.55),0 0 80px rgba(242,178,60,.25)}
.stat-ring{width:130px;height:6px;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.7}
/* ============ 5 · PORTFOLIO ============ */
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.tile{overflow:hidden;padding:10px}
.tile .thumb{width:100%;aspect-ratio:4/3;border-radius:var(--r-md);overflow:hidden;position:relative;
  border:1px solid rgba(92,224,245,.14)}
.tile .thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}
.tile .thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 30px rgba(6,14,13,.55)}
.tile .cap{display:flex;align-items:center;gap:10px;padding:14px 8px 6px}
.cap .chip{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:none}
.tile:nth-child(2n) .cap .chip{background:var(--amber);box-shadow:0 0 8px var(--amber)}
/* ============ 6 · AUDIENCE ============ */
.aud{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:44px}
.aud-card{display:flex;gap:24px;align-items:center;padding:34px 32px}
.aud-card .icon-tile{width:72px;height:72px;border-radius:20px;flex:none}
/* ============ 7 · CONTACT ============ */
.contact-panel{
  border-radius:26px;padding:70px 60px;text-align:center;position:relative;overflow:hidden;
  background:
    radial-gradient(600px 240px at 50% 0%, rgba(79,224,245,.22), transparent 70%),
    linear-gradient(160deg,#123B38,#0D2B29 60%,#0A1F1E);
  border:1px solid rgba(79,224,245,.3);
  box-shadow:0 0 60px rgba(79,224,245,.12), inset 0 1px 0 rgba(255,255,255,.08);
}
.contact-panel .trace{position:absolute;height:1px;left:0;right:0;
  background:linear-gradient(90deg,transparent,rgba(79,224,245,.4),transparent)}
.contact-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
/* ============ 8 · FOOTER ============ */
.footer{display:flex;align-items:center;justify-content:space-between;
  padding:30px 72px;border-top:1px solid rgba(92,224,245,.08);background:var(--canvas-deep)}
.foot-links{display:flex;gap:26px}
.foot-links .bar{height:7px}
/* alt band */
.band-deep{background:linear-gradient(180deg,var(--canvas-deep),rgba(8,18,17,.4))}
/* responsive */
@media(max-width:900px){
  section{padding:64px 28px}
  .nav,.footer{padding-left:28px;padding-right:28px}
  .hero-copy{padding:72px 28px}
  .cards3,.grid6{grid-template-columns:1fr 1fr}
  .case,.aud{grid-template-columns:1fr}
}
@media(max-width:600px){
  .cards3,.grid6{grid-template-columns:1fr}
  .menu .bar{display:none}
  .stat-num{font-size:64px}
}
</style>
